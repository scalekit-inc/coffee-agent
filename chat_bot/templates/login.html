<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Coffee Agent</title>
    <link rel="icon" type="image/svg+xml" href="/static/uploads/coffee-desk-favicon.svg">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        :root {
            --coffee-primary: hsl(26, 38%, 44%);
            --coffee-primary-foreground: hsl(210, 40%, 98%);
            --coffee-primary-hover: hsl(26, 38%, 50%);
            --coffee-background: hsl(0, 0%, 100%);
            --coffee-foreground: hsl(222.2, 84%, 4.9%);
            --coffee-muted: hsl(210, 40%, 96%);
            --coffee-muted-foreground: hsl(215.4, 16.3%, 46.9%);
            --coffee-border: hsl(214.3, 31.8%, 91.4%);
            --coffee-input: hsl(214.3, 31.8%, 91.4%);
            --coffee-ring: hsl(26, 38%, 44%);
            --coffee-radius: 0.5rem;
        }
        
        body {
            background: var(--coffee-background);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        
        .login-container {
            max-width: 24rem;
            width: 90%;
            padding: 2rem;
            background: var(--coffee-background);
            border-radius: var(--coffee-radius);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--coffee-border);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        
        .login-header p {
            color: var(--coffee-muted-foreground);
            font-size: 0.875rem;
            margin-top: 0;
        }
        
        .form-group {
            margin-bottom: 1.25rem;
        }
        
        .form-group label {
            display: block;
            color: var(--coffee-foreground);
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.625rem 0.75rem;
            background: var(--coffee-background);
            border: 1px solid var(--coffee-input);
            border-radius: calc(var(--coffee-radius) - 2px);
            color: var(--coffee-foreground);
            font-size: 0.875rem;
            transition: all 0.2s;
            box-sizing: border-box;
            font-family: inherit;
        }
        
        .form-group input:focus {
            outline: 2px solid transparent;
            outline-offset: 2px;
            border-color: var(--coffee-ring);
            box-shadow: 0 0 0 2px var(--coffee-ring);
        }
        
        .form-group input::placeholder {
            color: var(--coffee-muted-foreground);
        }
        
        .login-btn {
            width: 100%;
            padding: 0.625rem;
            background: var(--coffee-primary);
            color: var(--coffee-primary-foreground);
            border: 1px solid var(--coffee-primary);
            border-radius: calc(var(--coffee-radius) - 2px);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
            font-family: inherit;
        }
        
        .login-btn:hover {
            background: var(--coffee-primary-hover);
        }
        
        .login-btn:active {
            transform: scale(0.98);
        }
        
        .error-message {
            color: hsl(0, 84.2%, 60.2%);
            font-size: 0.875rem;
            margin-top: 0.75rem;
            text-align: center;
            padding: 0.75rem;
            background: hsl(0, 84.2%, 60.2%, 0.1);
            border-radius: calc(var(--coffee-radius) - 2px);
            border: 1px solid hsl(0, 84.2%, 60.2%, 0.2);
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0 1.25rem;
            color: var(--coffee-muted-foreground);
            font-size: 0.8125rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--coffee-border);
        }
        .divider span { padding: 0 0.75rem; }
        
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.625rem 0.75rem;
            background: var(--coffee-background);
            color: var(--coffee-foreground);
            border: 1px solid var(--coffee-border);
            border-radius: calc(var(--coffee-radius) - 2px);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            box-sizing: border-box;
            font-family: inherit;
        }
        .google-btn:hover {
            background: var(--coffee-muted);
            border-color: var(--coffee-muted-foreground);
        }
        .google-btn:active { transform: scale(0.98); }
        .google-btn svg { flex-shrink: 0; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 1.5rem;">
                <img src="/static/uploads/coffee-desk-name-icon.png" alt="Coffee Agent" style="height: 3rem; width: auto;">
            </div>
            <p>Sign in to access your AI Assistant</p>
        </div>
        
        <a href="/api/scalekit/authorize?provider=google" class="google-btn" id="googleLoginBtn">
            <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.67 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.16 7.09-10.27 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.67 48 24 48z"/></svg>
            Sign in with Google
        </a>
        
        <div class="divider"><span>or</span></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="login-btn">Sign In</button>
        </form>
        
        <div id="errorMessage" class="error-message" style="display: none;"></div>
    </div>

    <script>
        (function checkLoginError() {
            const params = new URLSearchParams(window.location.search);
            const error = params.get('error');
            if (!error) return;
            const messages = {
                auth_failed: 'Google sign-in was cancelled or failed. Please try again.',
                invalid_state: 'Invalid login state. Please try again.',
                missing_code: 'Missing authorization. Please try again.',
                exchange_failed: 'Could not complete sign-in. Please try again.',
                no_email: 'Could not get your email from Google. Please try again.',
                config: 'Sign-in is not configured. Please contact support.',
                unsupported_provider: 'This sign-in method is not supported.'
            };
            const msg = messages[error] || params.get('message') || 'Something went wrong. Please try again.';
            showError(msg);
            // Clean URL without reload
            if (window.history.replaceState) {
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        })();
        
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            // Basic validation
            if (!email || !password) {
                showError('Please fill in all fields');
                return;
            }
            
            if (password.length < 6) {
                showError('Password must be at least 6 characters long');
                return;
            }
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Store user info in session storage
                    sessionStorage.setItem('userName', email.split('@')[0]); // Use email prefix as name
                    sessionStorage.setItem('userEmail', email);
                    
                    // Redirect to main chat page
                    window.location.href = '/chat';
                } else {
                    showError(data.message || 'Login failed. Please try again.');
                }
            } catch (error) {
                showError('Network error. Please try again.');
            }
        });
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
